# cordis.yml — configuración del agente Si-Fi (Cordis)
#
# Ojo: el paquete npm `deepseek-harness@0.0.1` es hoy un placeholder sin código
# (ver NOTAS.md). Cordis sí es real y este archivo lo carga; cuando dsh publique
# su API se agrega el plugin del harness arriba de `sifi-tools` y éste registra
# las tools en `ctx.tools`.

plugins:
  sifi-tools:
    baseUrl: ${SIFID_URL}
    token: ${SIFID_TOKEN}
    timeoutMs: 30000

agent:
  name: Si-Fi
  prompt: prompts/system.md
  tools: sifi-tools
  # Política de permisos (§5.4.4): nada de shell libre; escrituras preguntan.
  permissions:
    default: ask
    allow:
      - sifi_panels
      - sifi_status
      - sifi_score
      - sifi_news
    ask:
      - sifi_design
      - sifi_offtarget
      - sifi_report
    deny:
      - bash
      - shell
